name: iOS build & test

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          # Нужен Xcode с iOS 26 SDK: код содержит ветки под iOS 26 за проверками доступности.
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          xcodebuild -showsdks | grep -i ios || true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('project.yml') }}
          restore-keys: ${{ runner.os }}-spm-

      - name: Resolve packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project AILifeAssistant.xcodeproj \
            -scheme AILifeAssistant

      - name: Pick simulator
        id: sim
        run: |
          DEVICE=$(xcrun simctl list devices available \
            | grep -Eo 'iPhone [0-9]+( Pro)?( Max)?' | tail -1)
          if [ -z "$DEVICE" ]; then DEVICE="iPhone 16"; fi
          echo "Using simulator: $DEVICE"
          echo "device=$DEVICE" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project AILifeAssistant.xcodeproj \
            -scheme AILifeAssistant \
            -configuration Debug \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.device }}" \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions || \
          xcodebuild build \
            -project AILifeAssistant.xcodeproj \
            -scheme AILifeAssistant \
            -configuration Debug \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.device }}" \
            CODE_SIGNING_ALLOWED=NO

      - name: Unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project AILifeAssistant.xcodeproj \
            -scheme AILifeAssistant \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.device }}" \
            CODE_SIGNING_ALLOWED=NO \
            -resultBundlePath TestResults.xcresult

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults.xcresult
          retention-days: 7

      # Сборка для симулятора, которую можно запустить в облачном симуляторе
      # (например, Appetize) и потыкать интерфейс без Mac и без устройства.
      - name: Package simulator build
        run: |
          set -o pipefail
          xcodebuild build             -project AILifeAssistant.xcodeproj             -scheme AILifeAssistant             -configuration Debug             -sdk iphonesimulator             -derivedDataPath build/DerivedData             CODE_SIGNING_ALLOWED=NO

          PRODUCTS_DIR="build/DerivedData/Build/Products/Debug-iphonesimulator"
          APP_PATH=$(find "$PRODUCTS_DIR" -maxdepth 1 -name "*.app" | head -1)

          if [ -z "$APP_PATH" ]; then
            echo "Не найден собранный .app в $PRODUCTS_DIR"
            exit 1
          fi

          echo "Собрано: $APP_PATH"
          # Архивируем из каталога продуктов, чтобы в zip лежал сам бандл,
          # а не цепочка вложенных папок: облачные симуляторы этого ждут.
          (cd "$PRODUCTS_DIR" && zip -r -y "$GITHUB_WORKSPACE/AILifeAssistant-simulator.zip" "$(basename "$APP_PATH")")
          ls -lh AILifeAssistant-simulator.zip

      - name: Upload simulator build
        uses: actions/upload-artifact@v4
        with:
          name: simulator-app
          path: AILifeAssistant-simulator.zip
          retention-days: 14
