name: AILifeAssistant

options:
  bundleIdPrefix: com.ivans
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: en
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_EMIT_LOC_STRINGS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    CODE_SIGN_STYLE: Automatic
    # Подпись в CI отключается флагом xcodebuild, а не здесь:
    # иначе не собрать сборку для устройства локально.

packages:
  # Пакет argmax-oss-swift содержит продукт WhisperKit (бывший репозиторий argmaxinc/WhisperKit).
  ArgmaxOSS:
    url: https://github.com/argmaxinc/argmax-oss-swift
    from: 1.1.0

targets:
  AILifeAssistant:
    type: application
    platform: iOS
    sources:
      - path: AILifeAssistant
        excludes:
          - "**/.DS_Store"
          - "**/Info.plist"
          - "**/*.entitlements"
    dependencies:
      - package: ArgmaxOSS
        product: WhisperKit
      - target: AILifeAssistantWidgets
        embed: true
      - target: AILifeAssistantShare
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ivans.ailifeassistant
        # PRODUCT_NAME не переопределяем: он задаёт имя бандла, на которое
        # ссылается TEST_HOST тестового таргета. Имя на домашнем экране
        # задаётся ключом CFBundleDisplayName ниже.
        PRODUCT_MODULE_NAME: AILifeAssistant
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited)"
    entitlements:
      path: AILifeAssistant/Resources/AILifeAssistant.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.ivans.ailifeassistant
    info:
      path: AILifeAssistant/Resources/Info.plist
      properties:
        CFBundleDisplayName: AI Assistant
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CFBundleLocalizations: [en, ru]
        CFBundleAllowMixedLocalizations: true
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        NSMicrophoneUsageDescription: "Микрофон нужен, чтобы записывать ваши голосовые заметки и команды."
        NSSpeechRecognitionUsageDescription: "Распознавание речи превращает вашу голосовую заметку в текст."
        NSCalendarsFullAccessUsageDescription: "Доступ к календарю нужен, чтобы создавать события из ваших голосовых команд."
        NSRemindersFullAccessUsageDescription: "Доступ к напоминаниям нужен, чтобы ваши голосовые напоминания появлялись в системном приложении Напоминания."
        UIBackgroundModes: [audio, processing, remote-notification]
        BGTaskSchedulerPermittedIdentifiers:
          - com.ivans.ailifeassistant.sync
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false

  # Виджеты: кнопка в Пункте управления, виджет блокировки
  # и живая активность с Динамическим островом.
  AILifeAssistantWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: AILifeAssistantWidgets
      # Тип живой активности общий с приложением: одно запускает, другое рисует.
      - path: AILifeAssistant/Integrations/CaptureActivityAttributes.swift
      # Виджет «Сегодня» читает базу сам: будить приложение ради
      # перерисовки нельзя, система его просто не запустит.
      - path: AILifeAssistant/Models
      - path: AILifeAssistant/App/Persistence.swift
      - path: AILifeAssistant/Core/Logging.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ivans.ailifeassistant.widgets
        PRODUCT_MODULE_NAME: AILifeAssistantWidgets
        SKIP_INSTALL: YES
    entitlements:
      path: AILifeAssistantWidgets/Widgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.ivans.ailifeassistant
    info:
      path: AILifeAssistantWidgets/Info.plist
      properties:
        CFBundleDisplayName: AI Assistant
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  # Приём текста, ссылок и картинок из других приложений.
  AILifeAssistantShare:
    type: app-extension
    platform: iOS
    sources:
      - path: AILifeAssistantShare
      # Расширение пишет прямо в общую базу, поэтому ему нужны модели
      # и конфигурация хранилища, но не весь слой разбора.
      - path: AILifeAssistant/Models
      - path: AILifeAssistant/App/Persistence.swift
      - path: AILifeAssistant/Core/Logging.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ivans.ailifeassistant.share
        PRODUCT_MODULE_NAME: AILifeAssistantShare
        SKIP_INSTALL: YES
    entitlements:
      path: AILifeAssistantShare/Share.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.ivans.ailifeassistant
    info:
      path: AILifeAssistantShare/Info.plist
      properties:
        CFBundleDisplayName: AI Assistant
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 1

  AILifeAssistantTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AILifeAssistantTests
    dependencies:
      - target: AILifeAssistant
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ivans.ailifeassistant.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  AILifeAssistant:
    build:
      targets:
        AILifeAssistant: all
        AILifeAssistantTests: [test]
    test:
      targets:
        - AILifeAssistantTests
      gatherCoverageData: true
    run:
      config: Debug
