name: AILifeAssistant

options:
  bundleIdPrefix: com.ivans
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: en
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_EMIT_LOC_STRINGS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    CODE_SIGN_STYLE: Automatic
    # Подпись в CI отключается флагом xcodebuild, а не здесь:
    # иначе не собрать сборку для устройства локально.

packages:
  # Пакет argmax-oss-swift содержит продукт WhisperKit (бывший репозиторий argmaxinc/WhisperKit).
  ArgmaxOSS:
    url: https://github.com/argmaxinc/argmax-oss-swift
    from: 1.1.0

targets:
  AILifeAssistant:
    type: application
    platform: iOS
    sources:
      - path: AILifeAssistant
        excludes:
          - "**/.DS_Store"
          - "**/Info.plist"
          - "**/*.entitlements"
    dependencies:
      - package: ArgmaxOSS
        product: WhisperKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ivans.ailifeassistant
        PRODUCT_NAME: AI Assistant
        PRODUCT_MODULE_NAME: AILifeAssistant
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited)"
    entitlements:
      path: AILifeAssistant/Resources/AILifeAssistant.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.ivans.ailifeassistant
    info:
      path: AILifeAssistant/Resources/Info.plist
      properties:
        CFBundleDisplayName: AI Assistant
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CFBundleLocalizations: [en, ru]
        CFBundleAllowMixedLocalizations: true
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes: [audio, processing]
        NSSupportsLiveActivities: true
        NSMicrophoneUsageDescription: "Микрофон нужен, чтобы записывать ваши голосовые заметки и команды."
        NSSpeechRecognitionUsageDescription: "Распознавание речи превращает вашу голосовую заметку в текст."
        NSCalendarsFullAccessUsageDescription: "Доступ к календарю нужен, чтобы создавать события из ваших голосовых команд."
        NSRemindersFullAccessUsageDescription: "Доступ к напоминаниям нужен, чтобы синхронизировать задачи с приложением Напоминания."
        BGTaskSchedulerPermittedIdentifiers:
          - com.ivans.ailifeassistant.sync
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false

  AILifeAssistantTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AILifeAssistantTests
    dependencies:
      - target: AILifeAssistant
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ivans.ailifeassistant.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  AILifeAssistant:
    build:
      targets:
        AILifeAssistant: all
        AILifeAssistantTests: [test]
    test:
      targets:
        - AILifeAssistantTests
      gatherCoverageData: true
    run:
      config: Debug
